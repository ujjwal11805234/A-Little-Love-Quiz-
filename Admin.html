<!DOCTYPE html>
<html><head><base target="_top"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;padding:22px;background:#fff0f5;font-family:Arial;color:#503342}.wrap{max-width:850px;margin:auto}.panel{background:white;border:1px solid #ffd0df;border-radius:20px;padding:22px;margin:14px 0;box-shadow:0 8px 30px #b94e7515}
h1{margin-top:0}.muted{color:#8b6b7a}input{padding:12px;border:1px solid #e8b9cb;border-radius:10px;font-size:16px;max-width:220px}.btn{border:0;border-radius:10px;padding:12px 16px;background:#e95891;color:white;font-weight:bold;cursor:pointer;margin:5px}.danger{background:#9d355b}.response{border-top:1px solid #f4d5e0;padding:16px 0}.q{font-weight:bold;margin:12px 0 4px}.a{white-space:pre-wrap}.hidden{display:none}.status{margin:12px 0;color:#a23c69}small{color:#987b89}
</style></head><body><div class="wrap">
<div class="panel"><h1>💌 Your quiz answers</h1><p class="muted">Enter your private admin PIN to view responses.</p><input id="pin" type="password" placeholder="Admin PIN"><button class="btn" onclick="load()">View answers</button><div id="status" class="status"></div></div>
<div id="results" class="panel hidden"><h2>Saved responses</h2><button class="btn" onclick="load()">Refresh</button><button class="btn danger" onclick="clearAll()">Clear all answers</button><div id="list"></div></div>
</div><script>
const qs=["First impression of me","Favourite memory of us","One thing I do that makes you smile","Who is more dramatic?","What should we do together more often?","How loved and appreciated do you feel?","Anything I could improve as a boyfriend?","One thing you would never change about us","Dream surprise date","Relationship happiness rating"];
function pin(){return document.getElementById("pin").value}
function load(){document.getElementById("status").textContent="Loading…";google.script.run.withSuccessHandler(data=>{document.getElementById("status").textContent=data.length+" response(s) found.";document.getElementById("results").classList.remove("hidden");const list=document.getElementById("list");list.innerHTML="";if(!data.length){list.textContent="No answers yet. Share the game link and check back soon 💗";return;}data.forEach((r,i)=>{const card=document.createElement("div");card.className="response";const h=document.createElement("h3");h.textContent=(r.name||"Someone")+" · "+r.submittedAt;card.appendChild(h);r.answers.forEach((a,j)=>{const q=document.createElement("div");q.className="q";q.textContent=(j+1)+". "+qs[j];const v=document.createElement("div");v.className="a";v.textContent=a;card.append(q,v);});list.appendChild(card);});}).withFailureHandler(e=>document.getElementById("status").textContent=e.message).getResponses(pin());}
function clearAll(){if(!confirm("Permanently clear every saved answer? This cannot be undone."))return;google.script.run.withSuccessHandler(m=>{document.getElementById("status").textContent=m;load();}).withFailureHandler(e=>document.getElementById("status").textContent=e.message).clearResponses(pin());}
</script></body></html>
